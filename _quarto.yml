project:
  type: website
  output-dir: docs
  resources:
    - assets/img/background/background.gif
    - google0edce4a177d73ddd.html
    # course section: files loaded by script at run time, which Quarto cannot discover
    - notes/diffgeo-gr/assets/interactive/*.js
    - notes/diffgeo-gr/assets/labels.json

# Sidebar of the course section "From Differential Geometry to General Relativity"
# (generated from the table of contents of the notes by _port/convert/build.py).
metadata-files:
  - notes/diffgeo-gr/_sidebar.yml

website:
  title: "Daniel López Cano"
  site-url: "https://daniellopezcano.github.io"

  # Uncomment when available
  favicon: assets/icons/site-mark.svg

  navbar:
    background: dark
    title: false
    logo: false
    left:
      - href: index.qmd
        text: Home
      - href: research_and_publications.qmd
        text: Research & Publications
      - href: teaching_and_projects.qmd
        text: Teaching & Projects
      - href: notes/diffgeo-gr/index.qmd
        text: Lecture Notes
      - href: outreach.qmd
        text: Outreach
      - href: cv.qmd
        text: CV
    search: true

  page-footer:
    border: false   # Quarto adds a footer border on every page once a sidebar exists; keep the footer as it was
    left: "© Daniel López Cano"
    right: "[Home](index.qmd)"

format:
  html:
    theme: darkly
    css: styles.css
    include-in-header:
      - includes/person-schema.html
    toc: false
    smooth-scroll: true
    code-copy: true
    anchor-sections: true
    link-external-icon: false
    link-external-newwindow: true
    grid:
      body-width: 1080px
      margin-width: 220px
      sidebar-width: 220px