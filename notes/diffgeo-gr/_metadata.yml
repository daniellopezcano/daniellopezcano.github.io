# Hand-written. Settings shared by every page of the course section
# "From Differential Geometry to General Relativity". The pages themselves are
# generated by _port/convert/build.py; this file is not.
sidebar: diffgeo-gr
toc: true
toc-depth: 3
toc-title: "On this page"
toc-location: right
page-layout: article
anchor-sections: true
smooth-scroll: false
footnotes-hover: false        # the course has its own footnote popovers (assets/course.js)
citations-hover: false
css:
  - assets/course.css
  - assets/interactive.css
html-math-method:
  method: mathjax
  url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
include-in-header: assets/_head.html
grid:
  sidebar-width: 310px
  body-width: 780px
  margin-width: 250px
  gutter-width: 2rem
